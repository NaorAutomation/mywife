<style>
    .hero-banner {
        background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(247,234,244,0.7) 50%, rgba(233,246,254,0.7) 100%);
    }
    
    .hero-banner h1 {
        color: #0F3460;
    }
    
    .hero-banner p {
        color: #333333;
    }
    
    .btn-primary {
        background: linear-gradient(90deg, var(--primary-pink) 0%, var(--primary-blue) 100%);

<script>

        // אנימציית כניסה של אלמנטי הבאנר
