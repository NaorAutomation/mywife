<style>
    .navbar-items {
        display: none; /* מתחיל מוסתר */
        flex-direction: column;
        width: 100%;
        background-color: white;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        z-index: 50;
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none; /* מונע לחיצות על האלמנט כשהוא מוסתר */
    }
    
    .navbar-items.show {
        display: flex;
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                    transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        animation: menu-reveal 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes menu-reveal {
        0% {
            opacity: 0;
            transform: translateY(-20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .menu-item {
        opacity: 0;
        transform: translateY(10px);
    }
    
    .navbar-items.show .menu-item {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.2s, transform 0.2s;
    }
    
    .mobile-menu-icon {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .mobile-menu-icon.open {
        transform: rotate(90deg);
    }
    
    @media (min-width: 768px) {
        .navbar-items {
            display: flex;
            flex-direction: row;
            position: static;
            background-color: transparent;
            box-shadow: none;
            padding: 0;
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }
        
        .menu-item {
            opacity: 1;
            transform: none;
        }
    }
</style>

<script>
    function toggleMobileMenu() {
        const navbarItems = document.getElementById('mobile-menu');
        const menuIcon = document.querySelector('.mobile-menu-icon');
        
        navbarItems.classList.toggle('show');
        menuIcon.classList.toggle('open');
        
        // אנימציה חלקה עם GSAP
        if (navbarItems.classList.contains('show')) {
            gsap.to('.menu-item', {
                opacity: 1,
                y: 0,
                stagger: 0.05,
                duration: 0.25,
                ease: "back.out(1.5)",
                delay: 0.1,
                overwrite: true
            });
        } else {
            // מאפס את האיברים למצב ההתחלתי כשהתפריט נסגר
            gsap.set('.menu-item', {
                opacity: 0,
                y: 10,
                delay: 0.2,
                overwrite: true
            });
        }
    }
</script>
