<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קשת הריפוי - טיפול התפתחותי לילדים</title>
    <!-- ספריות חיצוניות -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/ScrollTrigger.min.js"></script>
    
    <!-- סגנון ייחודי -->
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#F7A4C5',
                        'primary-blue': '#74C0E5',
                        'light-pink': '#FDD6E6',
                        'light-blue': '#B8E2F7'
                    },
                    fontFamily: {
                        'rubik': ['Rubik', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-rubik bg-gray-50">
    <!-- תפריט ניווט -->
    <div id="navbar-container"></div>
    
    <!-- תוכן האתר -->
    <main>
        <!-- באנר ראשי -->
        <section class="hero-banner relative overflow-hidden pt-24 pb-10 md:pt-32 md:pb-16">
            <div class="container mx-auto px-4">
                <div class="flex flex-col md:flex-row-reverse items-center md:gap-8">
                    <!-- טקסט בצד ימין (בעברית) -->
                    <div class="w-full md:w-5/12 text-right mb-8 md:mb-0 hero-content">
                        <h1 class="text-2xl md:text-4xl font-bold text-primary-blue mb-4 leading-tight">
                            מלווים כל ילד בדרך הייחודית שלו להתפתחות מיטבית
                        </h1>
                        <p class="text-base md:text-lg text-gray-800 mb-6">
                            מומחים להתפתחות הילד בגילאי הגן, עם התמחות בטיפול בספקטרום האוטיסטי ובעיכובים התפתחותיים
                        </p>
                        <p class="text-sm md:text-base text-gray-700 mb-8">
                            סביבה תומכת, מקצועית ומותאמת אישית לכל ילד וילדה
                        </p>
                        <a href="#contact" class="btn-primary inline-block px-8 py-3 rounded-full text-white font-bold shadow-lg transform transition-transform hover:scale-105">
                            קבע/י פגישת היכרות
                        </a>
                    </div>
                    
                    <!-- תמונה בצד שמאל -->
                    <div class="w-full md:w-7/12 md:pr-8 hero-content">
                        <div class="relative rounded-2xl overflow-hidden shadow-xl md:shadow-2xl md:max-w-lg md:mx-auto">
                            <img src="images/adorable-little-girl-drawing-paper-home-Copy.jpg" alt="ילדה מציירת" class="w-full h-auto object-cover">
                            <!-- צורות דקורטיביות -->
                            <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full bg-primary-pink opacity-30 blur-md"></div>
                            <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-primary-blue opacity-30 blur-md"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- עיטורי רקע -->
            <div class="absolute -top-24 -left-24 w-48 h-48 rounded-full bg-light-pink opacity-30 blur-md"></div>
            <div class="absolute -bottom-24 -right-24 w-60 h-60 rounded-full bg-light-blue opacity-30 blur-md"></div>
        </section>
        
        <!-- מכל לסקציית אודות -->
        <div id="about-container"></div>
        
        <!-- מכל לסקציית השירותים -->
        <div id="services-container"></div>
        
        <!-- מכל לסקציית המלצות -->
        <div id="testimonials-container"></div>
    </main>

    <!-- קבצי JavaScript -->
    <script src="js/main.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/about.js"></script>
    <script src="components/services.js"></script>
    <script src="components/testimonials.js"></script>
    
    <!-- אנימציה לבאנר -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            gsap.from('.hero-banner .w-full', {
                opacity: 0,
                y: 30,
                duration: 1,
                stagger: 0.2,
                ease: "power2.out"
            });
        });
    </script>
</body>
</html>
